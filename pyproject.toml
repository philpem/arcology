# Ruff lint configuration.
#
# `select` is explicit (not `extend-select` over Ruff's defaults) so a future
# Ruff release can't silently widen the ruleset under CI again — see issue
# #729, where an unpinned Ruff moved from 0.15 to 0.16 and turned master red
# on unchanged code via 454 newly-firing default-ruleset errors. New rule
# families only fire here once someone deliberately adds their code below.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "venv",
    ".venv",
    "data",
    "worker/tools",  # vendored C sources, not Python
    "doc",           # format research / reference scripts, not shipped code
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # Ruff's own defaults: pycodestyle-essential + pyflakes
    "I",   # isort — sorted, grouped imports
    "UP",  # pyupgrade — modernise syntax for target-version
    "B",   # flake8-bugbear — likely bugs (mutable defaults, broad except, etc.)
    "C402", "C408",         # flake8-comprehensions — unnecessary generator/dict/list calls
    "EXE001",               # flake8-executable — shebang present but file not +x
    "FURB122", "FURB188",   # refurb — for-loop file writes, slice → removeprefix/suffix
    "G201",                 # flake8-logging-format — logging.error(exc_info=) → logging.exception()
    "ISC004",               # implicit string concat inside a collection literal
    "PERF102", "PERF402",   # perflint — wrong dict iterator, manual list copy
    "PIE790", "PIE810",     # flake8-pie — unnecessary pass, repeated starts/endswith
    "PLC3002",              # pylint — unnecessary direct lambda call
    "PLR0402", "PLR1730",   # pylint — manual from-import, if/else min/max
    "PLW1510",              # pylint — subprocess.run without explicit check=
    "RUF007", "RUF010", "RUF012", "RUF013", "RUF022", "RUF046", "RUF059", "RUF100",
    "S110", "S112",         # flake8-bandit — try/except/pass|continue swallowing errors silently
    "SIM102", "SIM103", "SIM114", "SIM117",  # flake8-simplify
]
# Deliberately NOT selected (reviewed under issue #729, not just unvetted):
#   BLE (flake8-blind-except) — the worker/task-runner analysis pipeline and
#     optional-dependency import guards deliberately catch bare `Exception` to
#     report job failures / fall back gracefully rather than crash. Same kind
#     of call as the E711/E712 ignore below: the rule is actively wrong for
#     how this codebase works.
#   DTZ (flake8-datetimez) — DB `DateTime` columns are naive-UTC by convention
#     (populated via tz-aware `datetime.now(timezone.utc)`, stored naive by
#     Postgres/SQLite); code and tests correctly compare against naive
#     datetimes to match what SQLAlchemy returns from the DB.
ignore = [
    # SQLAlchemy filter expressions need ==/!= rather than is/is not, since
    # `Column == None` compiles to `IS NULL` whereas `Column is None` is a
    # Python identity check (always False) and breaks the query.
    "E711",  # comparison to None
    "E712",  # comparison to True/False
    # `open(path, 'r')` is preferred over the bare `open(path)` form even though
    # the mode string is technically redundant — being explicit aids readability.
    "UP015",  # redundant-open-modes
]

[tool.ruff.lint.isort]
# Don't insert blank lines between import sections (stdlib / third-party /
# first-party). The blank lines look fine at the top of a file but produce a
# distracting "lots of blank lines" gap in function-local import blocks.
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Tests prepend the repo root to sys.path before importing, which forces
# imports below the path setup.
"ci/test_*.py" = ["E402"]
# Worker entry-point sets sys.path so `arcology_shared/` is importable when the
# worker is run outside Docker.
"worker/worker.py" = ["E402"]
