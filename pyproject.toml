# Ruff lint configuration.
#
# The ruleset is pinned with an explicit `select` rather than layered on top of
# Ruff's defaults. Ruff 0.16 widened those defaults and turned CI red on
# unchanged code (issue #729); an explicit list stops a future release doing
# that again. The guarantee is against *default-set* widening only — a new rule
# added under a selected prefix (E, F, I, UP, B) still lands, so the version pin
# in .github/workflows/ci.yml stays as the second line of defence.
#
# To pull in another rule group, add it to `select` below, then fix or `ignore`
# whatever it reports.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "venv",
    ".venv",
    "data",
    "worker/tools",  # vendored C sources, not Python
    "doc",           # format research / reference scripts, not shipped code
]

[tool.ruff.lint]
select = [
    # Ruff's historical default set: pycodestyle essentials + pyflakes.
    "E4",       # imports (E401 multiple on one line, E402 not at top of file)
    "E7",       # statement-level errors (comparisons, bare except, ...)
    "E9",       # syntax / IO errors
    "F",        # pyflakes — undefined names, unused imports, f-string bugs
    # Long-standing additions.
    "I",        # isort — sorted, grouped imports
    "UP",       # pyupgrade — modernise syntax for target-version
    "B",        # flake8-bugbear — likely bugs (mutable defaults, broad except, etc.)
    # Adopted from Ruff 0.16's widened defaults (issue #729 triage).
    "RUF013",   # implicit Optional — `x: int = None` is a real annotation bug
    "SIM115",   # open() outside a context manager — leaked handles in a long-lived worker
    "PLW1510",  # subprocess.run without an explicit `check=` — silent command failures
    "EXE001",   # shebang without the exec bit — keeps `./script.py` working as the
                # shebang advertises. Git tracks the mode, so this survives a clone.
                # (EXE002, the converse, is deliberately not selected — an executable
                # helper without a shebang is a reasonable thing to add.)
]
# Rejected from Ruff 0.16's defaults (issue #729 triage). Counts are from that
# triage run against 0.16.1; these are deliberately *not* `ignore` entries,
# because the explicit `select` above never enables them in the first place.
#
#   RUF059 (157)  unused unpacked variable — 150 of them are `mock.patch` decorator
#                 arguments in ci/, where not asserting on a mock is the point.
#   BLE001  (86)  blind except — worker and analysis code catches `Exception` on
#                 purpose so one bad artefact cannot take down a run.
#   RUF100  (48)  unused noqa — every hit is a directive for a rule this config does
#                 not enable (E402/E712/BLE001). Enabling it would strip comments
#                 that document *why* the code is written the way it is.
#   DTZ     (19)  naive datetime — the DB columns store naive UTC; moving to
#                 tz-aware datetimes is a schema decision, not a lint fix.
#   C4, PIE, S, FURB, PERF, RUF0xx and the rest of SIM (~90)
#                 style-only. Sampled sites showed no defect; revisit individually.
ignore = [
    # SQLAlchemy filter expressions need ==/!= rather than is/is not, since
    # `Column == None` compiles to `IS NULL` whereas `Column is None` is a
    # Python identity check (always False) and breaks the query.
    "E711",  # comparison to None
    "E712",  # comparison to True/False
    # `open(path, 'r')` is preferred over the bare `open(path)` form even though
    # the mode string is technically redundant — being explicit aids readability.
    "UP015",  # redundant-open-modes
]

[tool.ruff.lint.isort]
# Don't insert blank lines between import sections (stdlib / third-party /
# first-party). The blank lines look fine at the top of a file but produce a
# distracting "lots of blank lines" gap in function-local import blocks.
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Tests prepend the repo root to sys.path before importing, which forces
# imports below the path setup.
"ci/test_*.py" = ["E402"]
# Worker entry-point sets sys.path so `arcology_shared/` is importable when the
# worker is run outside Docker.
"worker/worker.py" = ["E402"]
